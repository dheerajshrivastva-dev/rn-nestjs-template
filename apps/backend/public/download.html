<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1a1a2e" />
  <title>DueTech Admin — Download</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:   #6c63ff;
      --primary-d: #574fd6;
      --surface:   #1e1e2e;
      --surface-2: #2a2a3e;
      --surface-3: #32324a;
      --on-surface:  #e4e4f0;
      --on-surface-2:#a0a0c0;
      --success:   #4caf50;
      --error:     #ef5350;
      --radius:    14px;
    }

    html, body {
      min-height: 100%;
      background: var(--surface);
      color: var(--on-surface);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    header {
      background: var(--surface-2);
      border-bottom: 1px solid rgba(255,255,255,.07);
      padding: 0 20px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .header-logo {
      width: 34px;
      height: 34px;
      object-fit: contain;
    }
    .header-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--on-surface);
      letter-spacing: .3px;
    }
    .header-contact {
      font-size: 13px;
      color: var(--primary);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity .2s;
    }
    .header-contact:hover { opacity: .75; }
    .header-contact svg { flex-shrink: 0; }

    /* ── Main ── */
    main {
      max-width: 440px;
      margin: 0 auto;
      padding: 32px 20px 60px;
    }

    /* ── Hero ── */
    .hero {
      text-align: center;
      margin-bottom: 32px;
    }
    .hero-icon {
      width: 88px;
      height: 88px;
      object-fit: contain;
      border-radius: 20px;
      margin-bottom: 16px;
      box-shadow: 0 8px 32px rgba(108,99,255,.35);
    }
    .hero h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .hero p {
      font-size: 14px;
      color: var(--on-surface-2);
      line-height: 1.5;
    }

    /* ── Card ── */
    .card {
      background: var(--surface-2);
      border: 1px solid rgba(255,255,255,.07);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 16px;
    }
    .card-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,.05);
    }
    .card-row:last-child { border-bottom: none; }
    .card-label { color: var(--on-surface-2); }
    .card-value { font-weight: 600; font-size: 14px; }
    .badge-mandatory {
      display: inline-block;
      background: rgba(239,83,80,.15);
      color: var(--error);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      letter-spacing: .5px;
    }

    /* ── Release notes ── */
    .notes-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--on-surface-2);
      margin-bottom: 8px;
    }
    .notes-body {
      font-size: 14px;
      color: var(--on-surface);
      line-height: 1.65;
      white-space: pre-wrap;
    }

    /* ── Button ── */
    .btn-download {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px;
      background: var(--primary);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      text-decoration: none;
      transition: background .2s, transform .1s;
      margin-top: 8px;
      letter-spacing: .3px;
    }
    .btn-download:hover  { background: var(--primary-d); }
    .btn-download:active { transform: scale(.98); }
    .btn-download:disabled {
      background: var(--surface-3);
      color: var(--on-surface-2);
      cursor: not-allowed;
    }
    .btn-download svg { flex-shrink: 0; }

    /* ── Size tag ── */
    .file-meta {
      text-align: center;
      font-size: 12px;
      color: var(--on-surface-2);
      margin-top: 10px;
    }

    /* ── States ── */
    .state-loading, .state-error, .state-empty {
      text-align: center;
      padding: 48px 20px;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(108,99,255,.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .state-error h2, .state-empty h2 {
      font-size: 18px; margin-bottom: 8px;
    }
    .state-error p, .state-empty p {
      font-size: 14px; color: var(--on-surface-2);
    }
    .retry-btn {
      margin-top: 20px;
      background: none;
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      transition: background .2s;
    }
    .retry-btn:hover { background: rgba(108,99,255,.1); }

    /* ── Footer ── */
    footer {
      text-align: center;
      font-size: 12px;
      color: var(--on-surface-2);
      padding: 24px 20px;
      border-top: 1px solid rgba(255,255,255,.05);
    }
    footer a { color: var(--primary); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    /* ── Responsive tweaks ── */
    @media (max-width: 360px) {
      .hero h1 { font-size: 20px; }
      .btn-download { font-size: 15px; padding: 14px; }
    }
  </style>
</head>

      <h1>DueTech Admin</h1>
      <p>Download the latest version of the<br/>DueTech Admin app for Android.</p>
    </div>

    <!-- Dynamic content injected here -->
    <div id="content">
      <div class="state-loading">
        <div class="spinner"></div>
        <p style="color:var(--on-surface-2);font-size:14px;">Fetching latest release…</p>
      </div>
    </div>
  </main>

  <footer>
    &copy; <span id="year"></span> DueTech. All rights reserved.<br/>
    Questions? <a href="mailto:contact@duetech.in">contact@duetech.in</a>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    function fmtBytes(bytes) {
      if (!bytes || bytes === 0) return '';
      const mb = bytes / (1024 * 1024);
      return mb >= 1 ? mb.toFixed(1) + ' MB' : (bytes / 1024).toFixed(0) + ' KB';
    }

    function fmtDownloads(n) {
      if (!n || n === 0) return null;
      if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "k";
      return n.toString();
    }

    function fmtDate(iso) {
      return new Date(iso).toLocaleDateString('en-IN', {
        day: 'numeric', month: 'long', year: 'numeric'
      });
    }

    function renderRelease(r) {
      const sizeStr = fmtBytes(r.fileSizeBytes);
      const dlCount = fmtDownloads(r.downloadCount);
      const mandatory = r.isMandatory
        ? '<span class="badge-mandatory">REQUIRED</span>'
        : '';

      // Tracked download URL — server logs the download then redirects to the static file.
      // Falls back to the direct apkUrl if id is missing (shouldn't happen in practice).
      const downloadHref = r.id
        ? `/api/v1/app-release/download/${r.id}`
        : r.apkUrl;

      document.getElementById('content').innerHTML = `
        <div class="card">
          <div class="card-row">
            <span class="card-label">Version</span>
            <span class="card-value">${r.versionName} ${mandatory}</span>
          </div>
          <div class="card-row">
            <span class="card-label">Build</span>
            <span class="card-value">#${r.versionCode}</span>
          </div>
          <div class="card-row">
            <span class="card-label">Released</span>
            <span class="card-value">${fmtDate(r.createdAt)}</span>
          </div>
          ${dlCount ? `
          <div class="card-row">
            <span class="card-label">Downloads</span>
            <span class="card-value dl-count">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2.5"
                   stroke-linecap="round" stroke-linejoin="round"
                   style="opacity:.7;vertical-align:-1px;margin-right:4px">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
              </svg>${dlCount}
            </span>
          </div>` : ''}
        </div>

        <div class="card">
          <div class="notes-title">What's new</div>
          <div class="notes-body">${r.releaseNotes.replace(/</g,'&lt;')}</div>
        </div>

        <a class="btn-download" href="${downloadHref}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Download APK
        </a>
        ${sizeStr ? `<div class="file-meta">APK size · ${sizeStr}</div>` : ''}
      `;
    }

    function renderError(msg) {
      document.getElementById('content').innerHTML = `
        <div class="state-error">
          <h2>Oops!</h2>
          <p>${msg}</p>
          <button class="retry-btn" onclick="load()">Try again</button>
        </div>
      `;
    }

    function renderEmpty() {
      document.getElementById('content').innerHTML = `
        <div class="state-empty">
          <h2>No release yet</h2>
          <p>Check back soon or contact us at<br/>
             <a href="mailto:contact@duetech.in" style="color:var(--primary)">contact@duetech.in</a>
          </p>
        </div>
      `;
    }

    async function load() {
      document.getElementById('content').innerHTML = `
        <div class="state-loading">
          <div class="spinner"></div>
          <p style="color:var(--on-surface-2);font-size:14px;">Fetching latest release…</p>
        </div>
      `;
      try {
        const res = await fetch('/api/v1/app-release/latest?appType=admin');
        if (res.status === 404) { renderEmpty(); return; }
        if (!res.ok) throw new Error('Server error ' + res.status);
        const data = await res.json();
        renderRelease(data);
      } catch (e) {
        renderError('Could not load release info. Please check your connection.');
      }
    }

    load();
  </script>
</body>
</html>
